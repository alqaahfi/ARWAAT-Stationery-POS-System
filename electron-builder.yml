appId: com.arwaat.stationerysystems
productName: ARWAAT Stationery Systems

directories:
  output: release
  buildResources: build-resources

files:
  - src/main/**/*
  - src/renderer/dist/**/*
  - src/shared/**/*
  - package.json

# Native modules (better-sqlite3, bcrypt, printer) must stay unpacked from the
# asar archive — their compiled .node binaries can't be loaded from inside it.
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/bcrypt/**/*

# Window / shortcut icons for the two apps -> resources/icons/ (loaded via
# process.resourcesPath in src/main/windows.js, used by installer.nsh).
extraResources:
  - from: build-resources/admin.ico
    to: icons/admin.ico
  - from: build-resources/cashier.ico
    to: icons/cashier.ico

# Hardened Electron binary: no ELECTRON_RUN_AS_NODE / NODE_OPTIONS / --inspect,
# and only the integrity-checked app.asar can be loaded.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  target: nsis
  icon: build-resources/icon.ico

# In-app updates (electron-updater). `npm run release` uploads the installer, its
# blockmap and latest.yml as a DRAFT release on this private repo (needs env GH_TOKEN);
# the installed app reads published releases with a read-only token (GH_UPDATE_TOKEN,
# written into src/main/update/updateToken.generated.js at build time).
publish:
  provider: github
  owner: arwaheed
  repo: arwaat-pos-system
  private: true
  releaseType: draft

nsis:
  oneClick: false
  # The shop's database lives in %APPDATA%\stationary-pos-app: an update or an
  # uninstall must never delete it.
  deleteAppDataOnUninstall: false
  allowToChangeInstallationDirectory: true
  # The default single shortcut is replaced by "ARWAAT Admin" + "ARWAAT Cashier"
  # (Desktop and Start Menu), made and removed by build-resources/installer.nsh.
  createDesktopShortcut: false
  createStartMenuShortcut: false
  include: build-resources/installer.nsh
